[project]
name = "rolebrief-document-parser-service"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "pdfplumber==0.11.5",
  "pdfminer.six==20231228",
  "pypdfium2==5.13.0",
  "python-docx==1.1.2",
  "Pillow==11.1.0",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
