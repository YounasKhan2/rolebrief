services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rolebrief
      POSTGRES_USER: rolebrief
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-postgres-password}
    ports:
      - "5432:5432"
    volumes:
      - rolebrief_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolebrief -d rolebrief"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - rolebrief_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    command: server /data
    environment:
      RUSTFS_ACCESS_KEY: ${RESUME_STORAGE_ACCESS_KEY_ID:-rolebrief}
      RUSTFS_SECRET_KEY: ${RESUME_STORAGE_SECRET_ACCESS_KEY:-rolebrief-local-secret}
    ports:
      - "9000:9000"
    volumes:
      - rolebrief_rustfs:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs-init:
    image: quay.io/minio/mc:latest
    environment:
      RESUME_STORAGE_ACCESS_KEY_ID: ${RESUME_STORAGE_ACCESS_KEY_ID:-rolebrief}
      RESUME_STORAGE_SECRET_ACCESS_KEY: ${RESUME_STORAGE_SECRET_ACCESS_KEY:-rolebrief-local-secret}
      RESUME_STORAGE_BUCKET: ${RESUME_STORAGE_BUCKET:-rolebrief-resumes}
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set rustfs http://rustfs:9000 $$RESUME_STORAGE_ACCESS_KEY_ID $$RESUME_STORAGE_SECRET_ACCESS_KEY && mc mb --ignore-existing rustfs/$$RESUME_STORAGE_BUCKET"
      ]
    depends_on:
      rustfs:
        condition: service_healthy

  clamav:
    image: clamav/clamav:stable
    volumes:
      - rolebrief_clamav:/var/lib/clamav
      - ./docker/clamav/local.ndb:/var/lib/clamav/local.ndb
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s

  docling-service:
    build:
      context: ./docling-service
    environment:
      DOCLING_INTERNAL_TOKEN: ${DOCLING_INTERNAL_TOKEN:-replace-with-docling-internal-token}
      DOCLING_MAX_INPUT_BYTES: ${RESUME_UPLOAD_MAX_BYTES:-10485760}
      DOCLING_MAX_BLOCKS: ${RESUME_EXTRACTION_MAX_BLOCKS:-1500}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/internal/v1/health/ready', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: rolebrief-backend:dev
    build:
      context: ./backend
    command: node dist/main.js
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rolebrief:${POSTGRES_PASSWORD:-replace-with-local-postgres-password}@postgres:5432/rolebrief?schema=public
      REDIS_URL: redis://redis:6379
      RESUME_STORAGE_ENDPOINT: http://rustfs:9000
      RESUME_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      DOCLING_SERVICE_URL: http://docling-service:8080
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  worker:
    image: rolebrief-backend:dev
    build:
      context: ./backend
    command: node dist/worker.js
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rolebrief:${POSTGRES_PASSWORD:-replace-with-local-postgres-password}@postgres:5432/rolebrief?schema=public
      REDIS_URL: redis://redis:6379
      RESUME_STORAGE_ENDPOINT: http://rustfs:9000
      RESUME_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      DOCLING_SERVICE_URL: http://docling-service:8080
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      docling-service:
        condition: service_healthy

  scheduler:
    image: rolebrief-backend:dev
    build:
      context: ./backend
    command: node dist/scheduler.js
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rolebrief:${POSTGRES_PASSWORD:-replace-with-local-postgres-password}@postgres:5432/rolebrief?schema=public
      REDIS_URL: redis://redis:6379
      RESUME_STORAGE_ENDPOINT: http://rustfs:9000
      RESUME_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  migrate:
    image: rolebrief-backend:dev
    build:
      context: ./backend
    command: ./node_modules/.bin/prisma migrate deploy
    profiles: ["tools"]
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rolebrief:${POSTGRES_PASSWORD:-replace-with-local-postgres-password}@postgres:5432/rolebrief?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: rolebrief-backend:dev
    build:
      context: ./backend
    command: ./node_modules/.bin/tsx prisma/seed.ts
    profiles: ["tools"]
    env_file:
      - ./backend/.env.example
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://rolebrief:${POSTGRES_PASSWORD:-replace-with-local-postgres-password}@postgres:5432/rolebrief?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rolebrief_postgres:
  rolebrief_redis:
  rolebrief_rustfs:
  rolebrief_clamav:
